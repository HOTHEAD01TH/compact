<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compact</title>
  <style>
    :root { color-scheme: light; --ink: #1c1917; --paper: #f7f4ee; --line: #e0d9cc; --mark: #8c3a2f; }
    body { margin: 0; font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif; background: var(--paper); color: var(--ink); }
    main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { margin: 0 0 8px; }
    #banner { min-height: 1.4em; font-weight: 700; color: var(--mark); }
    button { font: inherit; padding: 6px 12px; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; }
    li { list-style: none; background: #fff; border: 1px solid var(--line); padding: 10px 12px; margin: 8px 0; }
    ul { padding: 0; }
    .drop { opacity: 0.85; }
    .body { margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Compact</h1>
  <p>Proxy in front of a coding-agent trace. Laya chooses keep, drop, or escalate per span. Dropped spans stay one click away. They are collapsed, not deleted.</p>
  <p id="banner" role="status">Laya not running</p>
  <button id="run" type="button">Compact trace</button>
  <ul id="list"></ul>
</main>
<script>
const banner = document.querySelector("#banner");
const list = document.querySelector("#list");

function render(spans) {
  list.replaceChildren();
  for (const span of spans) {
    const li = document.createElement("li");
    const title = document.createElement("p");
    const label = span.error === "Laya not running" ? "Laya not running" : (span.label ?? "unlabeled");
    title.textContent = span.id + " " + span.name + " — " + label;
    li.append(title);
    if (span.label === "drop" && span.error !== "Laya not running") {
      li.className = "drop";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "show span";
      const body = document.createElement("p");
      body.className = "body";
      body.hidden = true;
      body.textContent = span.text;
      btn.addEventListener("click", () => { body.hidden = !body.hidden; });
      li.append(btn, body);
    } else {
      const body = document.createElement("p");
      body.className = "body";
      body.textContent = span.text;
      li.append(body);
    }
    list.append(li);
  }
}

async function load() {
  const res = await fetch("/api/trace");
  render((await res.json()).spans);
}
async function health() {
  const data = await (await fetch("/api/health")).json();
  if (data.error === "Laya not running") banner.textContent = "Laya not running";
  else if (banner.textContent === "Laya not running") banner.textContent = "";
}
document.querySelector("#run").addEventListener("click", async () => {
  const res = await fetch("/api/compact", { method: "POST" });
  const data = await res.json();
  if (data.error === "Laya not running") banner.textContent = "Laya not running";
  render(data.spans || []);
});
health();
load();
setInterval(health, 3000);
</script>
</body>
</html>
